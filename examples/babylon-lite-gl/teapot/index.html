<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Testing Teapot Using Babylon Lite GL</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="../../../libs/gl-matrix.js"></script>
  <script type="importmap">
  {
    "imports": {
      "@babylonjs/lite-gl": "https://esm.sh/@babylonjs/lite-gl@1.4.0"
    }
  }
  </script>
</head>
<body>
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec3 position;
in vec3 normal;
in vec2 uv;
uniform mat4 worldViewProjection;
uniform mat4 world;
out vec3 vNormal;
out vec2 vTextureCoord;

void main() {
    vNormal = mat3(world) * normal;
    vTextureCoord = uv;
    gl_Position = worldViewProjection * vec4(position, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D texture_;
in vec3 vNormal;
in vec2 vTextureCoord;
out vec4 glFragColor;

void main() {
    vec3 lightDir = normalize(vec3(1.0, 0.0, 1.0));
    float diffuse = max(dot(normalize(vNormal), lightDir), 0.0);
    float lighting = 0.3 + 0.7 * diffuse;
    vec4 baseColor = texture(texture_, vTextureCoord);
    glFragColor = vec4(baseColor.rgb * lighting, baseColor.a);
}
</script>

<canvas id="c" width="465" height="465"></canvas>

<script type="module" src="index.js"></script>
</body>
</html>
